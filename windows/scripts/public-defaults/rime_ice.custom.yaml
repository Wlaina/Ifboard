# Generated by Ifboard Desktop (Public Default)
patch:
  # 无底色清爽白字「中 / 英 / 半 / 全」托盘图标
  schema/icon: "icons/cn.ico"
  schema/zhung_icon: "icons/cn.ico"
  schema/ascii_icon: "icons/en.ico"
  schema/half_icon: "icons/half.ico"
  schema/full_icon: "icons/full.ico"

  # 挂载万象离线上下文语法大模型（wanxiang-lts-zh-hans.gram）
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 6
    collocation_min_length: 3
    collocation_penalty: -14
    non_collocation_penalty: -6
    weak_collocation_penalty: -100
    rear_penalty: -20
  translator/contextual_suggestions: false
  translator/max_homophones: 8

  switches:
    - name: ascii_mode
      states: [ 中, Ａ ]
      reset: 0
    - name: ascii_punct
      states: [ ¥, $ ]
      reset: 1
    - name: traditionalization
      states: [ 简, 繁 ]
    - name: emoji
      states: [ 💀, 😄 ]
      reset: 1
    - name: full_shape
      states: [ 半角, 全角 ]
    - name: search_single_char
      states: [正常, 单字]
      abbrev: [词, 单]
